<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Dashboard - SmartNGO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        accent: '#f59e0b',
                        danger: '#ef4444',
                        warning: '#f97316',
                    }
                }
            }
        }
    </script>
    <style>
        #v-map { height: 400px; border-radius: 1.5rem; z-index: 10; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300 overflow-x-hidden">
    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/70 dark:bg-gray-900/70 backdrop-blur-md border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-[1600px] mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/" class="text-2xl font-bold text-primary">SmartNGO</a>
                <span class="bg-primary/10 text-primary px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest">Admin</span>
            </div>
            <div class="flex items-center space-x-4">
                <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
                <div class="flex items-center gap-3">
                    <span class="hidden md:block font-medium">NGO Dashboard</span>
                    <div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-bold">N</div>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-20 p-4 max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 h-[calc(100vh-80px)]">
        <!-- Section 1: Issues Feed (Left) -->
        <div class="lg:col-span-3 flex flex-col gap-4 overflow-hidden h-full">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-danger"></i>
                    Pending Issues
                </h2>
                <span id="pending-count" class="bg-danger/10 text-danger px-2 py-1 rounded-full text-[10px] font-bold">0</span>
            </div>
            <div id="issues-feed" class="flex-1 overflow-y-auto custom-scrollbar space-y-4 pr-2">
                <!-- Skeleton Loader -->
                <div class="animate-pulse space-y-4">
                    <div class="bg-gray-200 dark:bg-gray-800 h-32 rounded-2xl"></div>
                    <div class="bg-gray-200 dark:bg-gray-800 h-32 rounded-2xl"></div>
                    <div class="bg-gray-200 dark:bg-gray-800 h-32 rounded-2xl"></div>
                </div>
            </div>
        </div>

        <!-- Section 2: Map (Center) -->
        <div class="lg:col-span-6 flex flex-col gap-6 h-full">
            <!-- Map Card -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700 relative flex-1">
                <div class="absolute top-8 left-8 z-[20] flex gap-2">
                    <div class="bg-white dark:bg-gray-800 p-2 rounded-lg shadow-lg flex items-center gap-2 text-xs font-bold">
                        <div class="w-3 h-3 bg-secondary rounded-full"></div> Available
                    </div>
                    <div class="bg-white dark:bg-gray-800 p-2 rounded-lg shadow-lg flex items-center gap-2 text-xs font-bold">
                        <div class="w-3 h-3 bg-danger rounded-full"></div> Busy
                    </div>
                </div>
                <div id="v-map" class="h-full w-full"></div>
            </div>

            <!-- Stats Bar -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-lg">
                    <div class="text-xs text-gray-500 font-bold uppercase mb-1">Total Issues</div>
                    <div id="stat-total" class="text-2xl font-bold text-primary">0</div>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-lg">
                    <div class="text-xs text-gray-500 font-bold uppercase mb-1">Assigned</div>
                    <div id="stat-assigned" class="text-2xl font-bold text-accent">0</div>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-lg">
                    <div class="text-xs text-gray-500 font-bold uppercase mb-1">Resolved</div>
                    <div id="stat-resolved" class="text-2xl font-bold text-secondary">0</div>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-lg">
                    <div class="text-xs text-gray-500 font-bold uppercase mb-1">Volunteers</div>
                    <div id="stat-volunteers" class="text-2xl font-bold text-gray-700 dark:text-gray-300">0</div>
                </div>
            </div>
        </div>

        <!-- Section 3: Analytics (Right) -->
        <div class="lg:col-span-3 flex flex-col gap-6 overflow-y-auto custom-scrollbar h-full pr-2">
            <h2 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-chart-simple text-primary"></i>
                Impact Analytics
            </h2>
            
            <!-- Pie: Issue types -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-lg">
                <h3 class="text-sm font-bold mb-4">Issue Distribution</h3>
                <canvas id="pieChart" class="max-h-[200px]"></canvas>
            </div>

            <!-- Bar: Volunteers by skill -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-lg">
                <h3 class="text-sm font-bold mb-4">Skills Availability</h3>
                <canvas id="barChart" class="max-h-[200px]"></canvas>
            </div>

            <!-- Line: Resolved over time -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-lg">
                <h3 class="text-sm font-bold mb-4">Resolution Velocity</h3>
                <canvas id="lineChart" class="max-h-[200px]"></canvas>
            </div>
        </div>
    </main>

    <!-- Smart Matching Modal -->
    <div id="match-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl max-w-2xl w-full mx-4 shadow-2xl animate-modal-in">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h3 class="text-2xl font-bold mb-1">Smart Matching</h3>
                    <p id="match-issue-title" class="text-gray-500 text-sm">Issue: Broken Water Pipe</p>
                </div>
                <button id="close-match" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"><i class="fa-solid fa-times text-xl"></i></button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="matches-container">
                <!-- Matches will be populated here -->
            </div>

            <div class="mt-8 flex gap-4">
                <button id="auto-assign" class="flex-1 bg-primary text-white py-4 rounded-xl font-bold hover:bg-blue-600 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Assign Best Match
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2"></div>

    <script type="module" src="ngo.js"></script>
</body>
</html>
