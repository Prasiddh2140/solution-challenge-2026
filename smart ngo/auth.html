<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register - SmartNGO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        accent: '#f59e0b',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center transition-colors duration-300">
    <div class="max-w-md w-full mx-4">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700">
            <div class="text-center mb-8">
                <a href="/" class="text-3xl font-bold text-primary block mb-2">SmartNGO</a>
                <h2 id="form-title" class="text-xl font-semibold">Welcome Back</h2>
                <p id="form-subtitle" class="text-gray-500 dark:text-gray-400">Please enter your details</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div id="role-container" class="grid grid-cols-3 gap-2 mb-6 hidden">
                    <button type="button" data-role="community" class="role-btn p-2 text-xs border rounded-lg border-primary text-primary bg-primary/10 transition hover:bg-primary/20">Community</button>
                    <button type="button" data-role="volunteer" class="role-btn p-2 text-xs border rounded-lg border-gray-300 dark:border-gray-600 transition hover:bg-gray-100 dark:hover:bg-gray-700">Volunteer</button>
                    <button type="button" data-role="ngo" class="role-btn p-2 text-xs border rounded-lg border-gray-300 dark:border-gray-600 transition hover:bg-gray-100 dark:hover:bg-gray-700">NGO</button>
                    <input type="hidden" id="selected-role" value="community">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3 top-3 text-gray-400"></i>
                        <input type="email" id="email" class="w-full pl-10 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-400"></i>
                        <input type="password" id="password" class="w-full pl-10 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <span>Sign In</span>
                    <i id="spinner" class="fa-solid fa-spinner fa-spin hidden"></i>
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-white dark:bg-gray-800 px-2 text-gray-500">Or continue with</span>
                </div>
            </div>

            <button id="google-btn" class="w-full flex items-center justify-center gap-2 border border-gray-200 dark:border-gray-600 py-3 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700 transition font-medium">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5 h-5" alt="Google">
                Google
            </button>

            <p class="mt-8 text-center text-sm text-gray-600 dark:text-gray-400">
                <span id="toggle-text">Don't have an account?</span>
                <button id="toggle-auth" class="text-primary font-bold hover:underline">Sign Up</button>
            </p>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2"></div>

    <script type="module" src="auth.js"></script>
</body>
</html>
